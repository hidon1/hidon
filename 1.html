<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>חידון התנ"ך - ראש בראש</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/favicon.ico" rel="icon" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght=400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            font-family: 'Frank Ruhl Libre', serif;
        }

        .main-game-container {
            width: 95%;
            max-width: 900px;
            text-align: center;
        }

        .players-info-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #3498db;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .player-score {
            font-size: 1.2rem;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .quiz-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            margin-top: 20px;
        }

        #questionText {
            font-size: 2rem;
            color: #0d47a1;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .answer-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .answer-grid .answer {
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .answer-grid .answer:hover {
            background-color: #f0f0f0;
        }

        .answer-grid .answer.correct { background-color: #2ecc71; color: white; }
        .answer-grid .answer.wrong { background-color: #e74c3c; color: white; }

        .loading-message, .final-results {
            font-size: 1.8rem;
            color: #333;
            margin-top: 50px;
        }

        .final-results h2 {
            font-size: 2.5rem;
            color: #2980b9;
        }

        .final-results p {
            font-size: 1.5rem;
        }

        .final-results .winner {
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <h1>ממתין לשחקן אחר...</h1>
        <p>קוד החדר שלך: <span id="roomCodeDisplay"></span></p>
        <button onclick="leaveRoom()">יציאה</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <div class="main-game-container">
            <div class="players-info-container">
                <div class="player-card" id="player1Card">
                    <img id="player1Avatar" src="" alt="שחקן 1">
                    <span class="player-name" id="player1Name"></span>
                    <span class="player-score" id="player1Score"></span>
                </div>
                <div class="player-card" id="player2Card">
                    <img id="player2Avatar" src="" alt="שחקן 2">
                    <span class="player-name" id="player2Name"></span>
                    <span class="player-score" id="player2Score"></span>
                </div>
            </div>

            <div id="quizContainer" class="quiz-section">
                <div class="timer">
                    <div class="bar-timer" id="timerBar"></div>
                </div>
                <h3 id="questionText"></h3>
                <div class="answer-grid" id="answers"></div>
                <p>שאלה <span id="currentQuestionNum">1</span> מתוך <span id="totalQuestions">20</span></p>
            </div>
        </div>
    </div>

    <div id="resultsScreen" style="display:none;">
        <div class="final-results">
            <h2 id="winnerMessage"></h2>
            <p><strong>התוצאה הסופית:</strong></p>
            <p id="player1FinalScore"></p>
            <p id="player2FinalScore"></p>
            <button onclick="window.location.href='index.html'">חזור לדף הבית</button>
        </div>
    </div>
    <script type="module" src="firebase_init.js"></script>
    <script src="sound_manager.js"></script>
    
<script>
    // משתנים גלובליים
    let myUserId = null;
    let myDisplayName = null;
    let myAvatar = null;
    let opponentId = null;
    let roomId = null;
    let isAnswerLocked = false;
    let timer = null;
    
    // פונקציה לבחירת 20 שאלות אקראיות
    async function generateRandomQuestions(count) {
        // וודא שהחיבור לפיירבייס קיים
        if (!window.firebase || !window.firebase.database) {
            console.error("Firebase is not initialized.");
            return [];
        }
        
        // דוגמה למיקום נתונים במאגר
        const questionsRef = window.firebase.database.ref('questions'); // שנה את הנתיב
        const snapshot = await window.firebase.database.get(questionsRef);
        const allQuestions = snapshot.val();
        
        const selectedQuestions = [];
        const questionKeys = Object.keys(allQuestions);
        for (let i = 0; i < count; i++) {
            const randomIndex = Math.floor(Math.random() * questionKeys.length);
            const randomKey = questionKeys[randomIndex];
            selectedQuestions.push(allQuestions[randomKey]);
            questionKeys.splice(randomIndex, 1);
        }
        return selectedQuestions;
    }

    // פונקציה להתחלת המשחק לאחר טעינת הדף
    document.addEventListener('DOMContentLoaded', () => {
        window.firebase.auth.onAuthStateChanged(user => {
            if (user) {
                myUserId = user.uid;
                const urlParams = new URLSearchParams(window.location.search);
                roomId = urlParams.get('roomId');
                
                // קבלת פרטי המשתמש הנוכחי
                window.firebase.database.ref('users/' + myUserId).once('value', snapshot => {
                    const userData = snapshot.val();
                    if (userData) {
                        myDisplayName = userData.displayName || 'שחקן אנונימי';
                        myAvatar = userData.avatar || 'default_avatar.png';
                    }
                });

                if (roomId) {
                    listenForGameState(roomId);
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                alert('עליך להתחבר כדי לשחק.');
                window.location.href = 'index.html';
            }
        });
    });

    // פונקציית האזנה למצב החדר ב-Firebase
    function listenForGameState(roomId) {
        const roomRef = window.firebase.database.ref('headToHeadMatches/' + roomId);
        window.firebase.database.onValue(roomRef, snapshot => {
            const roomData = snapshot.val();
            if (!roomData) {
                alert('החדר לא קיים או נמחק.');
                window.location.href = 'index.html';
                return;
            }

            const playerIds = Object.keys(roomData.players);
            if (playerIds.length < 2) {
                document.getElementById('loadingScreen').style.display = 'flex';
                document.getElementById('roomCodeDisplay').textContent = roomId;
                document.getElementById('gameScreen').style.display = 'none';
                return;
            }

            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('resultsScreen').style.display = 'none';

            opponentId = playerIds.find(id => id !== myUserId);

            if (!roomData.questions) {
                generateRandomQuestions(20).then(questions => {
                    window.firebase.database.update(roomRef, { 
                        questions: questions,
                        currentQuestionIndex: 0,
                        status: 'playing'
                    });
                });
            } else if (roomData.status === 'playing') {
                displayQuestion(roomData);
            } else if (roomData.status === 'finished') {
                showFinalResults(roomData);
            }
        });
    }

    // עדכון פרטי השחקנים
    function updatePlayerCards(players) {
        // קוד זה נכון ואינו דורש שינוי
    }

    // הצגת השאלה הנוכחית
    function displayQuestion(roomData) {
        // קוד זה נכון ואינו דורש שינוי
    }

    // שליחת התשובה ל-Firebase
    async function submitAnswer(isCorrect, questionIndex) {
        const roomRef = window.firebase.database.ref('headToHeadMatches/' + roomId);
        const myAnswerRef = window.firebase.database.ref(roomRef, `answers/${questionIndex}/${myUserId}`);
        await window.firebase.database.set(myAnswerRef, {
            correct: isCorrect,
            timestamp: Date.now()
        });
    }

    // מעבר לשאלה הבאה לאחר ששני השחקנים ענו
    function moveToNextQuestion(roomData) {
        const newIndex = roomData.currentQuestionIndex + 1;
        const roomRef = window.firebase.database.ref('headToHeadMatches/' + roomId);
        if (newIndex >= 20) {
            window.firebase.database.update(roomRef, { status: 'finished' });
        } else {
            window.firebase.database.update(roomRef, { currentQuestionIndex: newIndex });
        }
    }

    // סיום המשחק
    async function endGame() {
        const roomRef = window.firebase.database.ref('headToHeadMatches/' + roomId);
        const snapshot = await window.firebase.database.get(roomRef);
        const roomData = snapshot.val();
        if (!roomData || roomData.status === 'finished') return;

        // עדכון ניקוד סופי
        const myScoreRef = window.firebase.database.ref(roomRef, `players/${myUserId}/score`);
        const opponentScoreRef = window.firebase.database.ref(roomRef, `players/${opponentId}/score`);
        await window.firebase.database.set(myScoreRef, roomData.answers[myUserId].filter(a => a.correct).length);
        await window.firebase.database.set(opponentScoreRef, roomData.answers[opponentId].filter(a => a.correct).length);
        
        // הכרזת המנצח וחלוקת המטבעות
        const myScore = roomData.answers[myUserId].filter(a => a.correct).length;
        const opponentScore = roomData.answers[opponentId].filter(a => a.correct).length;
        const pot = roomData.pot;

        if (myScore > opponentScore) {
            awardCoins(myUserId, pot);
        } else if (opponentScore > myScore) {
            awardCoins(opponentId, pot);
        } else {
            awardCoins(myUserId, pot / 2);
            awardCoins(opponentId, pot / 2);
        }

        await window.firebase.database.update(roomRef, { status: 'finished' });
    }

    // חלוקת המטבעות למנצח
    async function awardCoins(winnerId, amount) {
        const winnerRef = window.firebase.database.ref('users/' + winnerId);
        const snapshot = await window.firebase.database.get(winnerRef);
        if (snapshot.exists()) {
            const currentCoins = snapshot.val().coins || 0;
            const newCoins = currentCoins + amount;
            await window.firebase.database.update(winnerRef, { coins: newCoins });
        }
    }

    // הצגת תוצאות סופיות
    function showFinalResults(roomData) {
        // קוד זה נכון ואינו דורש שינוי
    }

    // פונקציה לחזרה למסך הראשי
    function leaveRoom() {
        if (roomId) {
            window.firebase.database.ref('headToHeadMatches/' + roomId).remove();
        }
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
